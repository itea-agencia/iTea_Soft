services:
  - type: web
    name: itea-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # --- Siigo ---
      # Credenciales: se definen en el dashboard de Render, nunca en el repo.
      - key: SIIGO_USERNAME
        sync: false
      - key: SIIGO_ACCESS_KEY
        sync: false
      - key: SIIGO_BASE_URL
        value: https://api.siigo.com
      - key: SIIGO_PARTNER_ID
        value: iTeaSoftApp
      # 30685 = Factura electronica de venta (ElectronicInvoice, automatic_number)
      - key: SIIGO_DOCUMENT_ID
        value: "30685"
      # 831 = info@samturtravel.com (SAMTUR TRAVEL AGENCY SAS)
      - key: SIIGO_SELLER_ID
        value: "831"
      # CRE quedo INACTIVO en Siigo. Se define en la Fase 2, por categoria.
      - key: SIIGO_ITEM_CODE_DEFAULT
        value: ""
      # 12467 = Otros
      - key: SIIGO_PAYMENT_TYPE_DEFAULT
        value: "12467"
      # 8872 = IVA 19%
      - key: SIIGO_IVA_TAX_ID
        value: "8872"
      # Mantener en true hasta que contabilidad valide el mapeo de la Fase 2.
      - key: SIIGO_DRY_RUN
        value: "true"

# Solo la base. El backend y el frontend corren en el host con `npm run dev`.
services:
  postgres:
    image: postgres:15-alpine
    container_name: itea_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1033488906b
      POSTGRES_DB: samtur-development
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samtur-development"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
